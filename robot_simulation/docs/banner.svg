<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="scan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f6ad55"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- warehouse racks -->
  <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="610" y="40" width="150" height="34" rx="4"/>
    <rect x="800" y="40" width="150" height="34" rx="4"/>
    <rect x="990" y="40" width="150" height="34" rx="4"/>
    <rect x="610" y="266" width="150" height="34" rx="4"/>
    <rect x="800" y="266" width="150" height="34" rx="4"/>
    <rect x="990" y="266" width="150" height="34" rx="4"/>
  </g>

  <!-- graph: edges -->
  <g stroke="#8fb3d9" stroke-opacity="0.35" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M620 170H1130"/>
    <path d="M685 170V110M875 170V110M1065 170V110"/>
    <path d="M685 170V230M875 170V230M1065 170V230"/>
  </g>
  <!-- order route: base and horizon -->
  <path d="M685 170H965" stroke="#4fd1c5" stroke-width="5" stroke-linecap="round"/>
  <path d="M965 170H1065V110" stroke="#4fd1c5" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>

  <!-- nodes -->
  <g stroke="#0f1b2d" stroke-width="3">
    <circle cx="685" cy="170" r="9" fill="#4fd1c5"/>
    <circle cx="875" cy="170" r="9" fill="#4fd1c5"/>
    <circle cx="965" cy="170" r="9" fill="#4fd1c5"/>
    <circle cx="1065" cy="170" r="9" fill="#8fb3d9"/>
    <circle cx="1065" cy="110" r="9" fill="#8fb3d9"/>
    <circle cx="685" cy="110" r="7" fill="#5a7898"/>
    <circle cx="875" cy="110" r="7" fill="#5a7898"/>
    <circle cx="685" cy="230" r="7" fill="#5a7898"/>
    <circle cx="875" cy="230" r="7" fill="#5a7898"/>
    <circle cx="1065" cy="230" r="7" fill="#5a7898"/>
    <circle cx="1130" cy="170" r="7" fill="#5a7898"/>
    <circle cx="620" cy="170" r="7" fill="#5a7898"/>
  </g>

  <!-- pallet at the pick node -->
  <g transform="translate(951 128)">
    <rect width="28" height="20" rx="2" fill="#f6ad55"/>
    <path d="M0 7H28M0 14H28" stroke="#c97b26" stroke-width="2"/>
  </g>
  <text x="965" y="208" fill="#f6ad55" font-size="13" text-anchor="middle" font-weight="600">pick</text>

  <!-- robot -->
  <g transform="translate(800 170)">
    <circle r="62" fill="url(#scan)"/>
    <rect x="-34" y="-22" width="68" height="44" rx="10" fill="#e2e8f0"/>
    <rect x="-34" y="-22" width="68" height="44" rx="10" fill="none" stroke="#4fd1c5" stroke-width="2"/>
    <rect x="-26" y="-27" width="14" height="6" rx="2" fill="#2d3748"/>
    <rect x="12" y="-27" width="14" height="6" rx="2" fill="#2d3748"/>
    <rect x="-26" y="21" width="14" height="6" rx="2" fill="#2d3748"/>
    <rect x="12" y="21" width="14" height="6" rx="2" fill="#2d3748"/>
    <circle cx="20" cy="0" r="7" fill="#2d3748"/>
    <circle cx="20" cy="0" r="3" fill="#4fd1c5"/>
    <rect x="-24" y="-8" width="30" height="16" rx="3" fill="#cbd5e0"/>
    <path d="M38 0H62" stroke="#f6ad55" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- MQTT messages -->
  <g font-size="13" font-weight="600">
    <g transform="translate(700 92)">
      <rect x="-4" y="-17" width="66" height="24" rx="12" fill="#2b6cb0"/>
      <text x="29" y="0" fill="#ffffff" text-anchor="middle">order</text>
    </g>
    <g transform="translate(700 252)">
      <rect x="-4" y="-17" width="62" height="24" rx="12" fill="#2f855a"/>
      <text x="27" y="0" fill="#ffffff" text-anchor="middle">state</text>
    </g>
    <g transform="translate(922 252)">
      <rect x="-4" y="-17" width="112" height="24" rx="12" fill="#6b46c1"/>
      <text x="52" y="0" fill="#ffffff" text-anchor="middle">instantActions</text>
    </g>
  </g>

  <!-- title -->
  <text x="56" y="132" fill="#ffffff" font-size="46" font-weight="700">Robot_simulation</text>
  <text x="58" y="172" fill="#a0c4e8" font-size="21">mobile robot simulator</text>
  <text x="58" y="200" fill="#a0c4e8" font-size="21">speaking VDA 5050 v3 over MQTT</text>
  <g font-size="14" font-weight="600">
    <rect x="58" y="226" width="120" height="28" rx="14" fill="#4fd1c5" fill-opacity="0.15" stroke="#4fd1c5"/>
    <text x="118" y="245" fill="#4fd1c5" text-anchor="middle">VDA 5050 v3</text>
    <rect x="188" y="226" width="72" height="28" rx="14" fill="#f6ad55" fill-opacity="0.15" stroke="#f6ad55"/>
    <text x="224" y="245" fill="#f6ad55" text-anchor="middle">MQTT</text>
    <rect x="270" y="226" width="76" height="28" rx="14" fill="#a0c4e8" fill-opacity="0.15" stroke="#a0c4e8"/>
    <text x="308" y="245" fill="#a0c4e8" text-anchor="middle">C++23</text>
    <rect x="356" y="226" width="166" height="28" rx="14" fill="#b794f4" fill-opacity="0.15" stroke="#b794f4"/>
    <text x="439" y="245" fill="#b794f4" text-anchor="middle">BehaviorTree.CPP</text>
  </g>
</svg>
