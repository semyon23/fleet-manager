<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="scan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a0c4e8"/>
    </marker>
    <marker id="arrow-mqtt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f6ad55"/>
    </marker>

    <!-- AMR with differential drive, top view, centered at (0, 0), heading +x -->
    <g id="robot">
      <circle r="58" fill="url(#scan)"/>
      <g fill="#334155" stroke="#cbd5e1" stroke-width="1.5">
        <rect x="-11" y="-29" width="22" height="9" rx="3"/>
        <rect x="-11" y="20" width="22" height="9" rx="3"/>
      </g>
      <g stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round">
        <path d="M-6 -27V-22M0 -27V-22M6 -27V-22"/>
        <path d="M-6 22V27M0 22V27M6 22V27"/>
      </g>
      <rect x="-34" y="-22" width="68" height="44" rx="10" fill="#e2e8f0" stroke="#4fd1c5" stroke-width="2"/>
      <g fill="#94a3b8" stroke="#64748b" stroke-width="1">
        <circle cx="-27" cy="-15" r="3"/>
        <circle cx="-27" cy="15" r="3"/>
        <circle cx="27" cy="-15" r="3"/>
        <circle cx="27" cy="15" r="3"/>
      </g>
      <rect x="-24" y="-8" width="30" height="16" rx="3" fill="#cbd5e1"/>
      <circle cx="20" cy="0" r="7" fill="#2d3748"/>
      <circle cx="20" cy="0" r="3" fill="#4fd1c5"/>
    </g>

    <!-- inbox queue of a session: three messages waiting -->
    <g id="inbox">
      <rect x="0" y="-7" width="8" height="14" rx="2" fill="#4fd1c5" fill-opacity="0.9"/>
      <rect x="11" y="-7" width="8" height="14" rx="2" fill="#4fd1c5" fill-opacity="0.6"/>
      <rect x="22" y="-7" width="8" height="14" rx="2" fill="#4fd1c5" fill-opacity="0.3"/>
    </g>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- ============================ fleet_control ============================ -->
  <g transform="translate(598 185)">
    <circle r="30" fill="url(#glow)"/>
    <circle r="16" fill="none" stroke="#63b3ed" stroke-width="7" stroke-dasharray="5.03 7.54"/>
    <circle r="14" fill="#2b6cb0" stroke="#63b3ed" stroke-width="2"/>
    <circle r="5" fill="#0f1b2d" stroke="#63b3ed" stroke-width="2"/>
  </g>
  <text x="598" y="235" fill="#63b3ed" font-size="14" font-weight="600" text-anchor="middle">fleet_control</text>

  <path d="M630 185H674" stroke="#a0c4e8" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="652" y="175" fill="#a0c4e8" font-size="12" font-weight="600" text-anchor="middle">gRPC</text>

  <!-- ============================ fleet_dispatch ============================ -->
  <rect x="680" y="28" width="250" height="304" rx="14" fill="#2c7a7b" fill-opacity="0.12" stroke="#4fd1c5" stroke-width="1.5"/>

  <!-- header: clipboard icon + name -->
  <g transform="translate(708 58) scale(0.7)">
    <rect x="-15" y="-19" width="30" height="40" rx="5" fill="#2c7a7b" fill-opacity="0.5" stroke="#4fd1c5" stroke-width="2.5"/>
    <rect x="-7" y="-23" width="14" height="8" rx="2.5" fill="#4fd1c5"/>
    <path d="M-7 13V2H6V-8" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#4fd1c5" stroke="#e2e8f0" stroke-width="1.5">
      <circle cx="-7" cy="13" r="3"/>
      <circle cx="-7" cy="2" r="3"/>
      <circle cx="6" cy="2" r="3"/>
    </g>
    <circle cx="6" cy="-8" r="3.5" fill="#f6ad55" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="730" y="64" fill="#4fd1c5" font-size="17" font-weight="700">fleet_dispatch</text>

  <!-- one RobotSession per robot -->
  <g font-size="13">
    <g transform="translate(696 102)">
      <rect width="218" height="48" rx="9" fill="#0f1b2d" fill-opacity="0.65" stroke="#4fd1c5" stroke-opacity="0.5"/>
      <circle cx="16" cy="17" r="4.5" fill="#48bb78"/>
      <text x="28" y="21" fill="#ffffff" font-weight="600">RobotSession amr1</text>
      <text x="16" y="38" fill="#a0c4e8" font-size="11">driving · order o-17</text>
      <use href="#inbox" x="176" y="24"/>
    </g>
    <g transform="translate(696 162)">
      <rect width="218" height="48" rx="9" fill="#0f1b2d" fill-opacity="0.65" stroke="#4fd1c5" stroke-opacity="0.5"/>
      <circle cx="16" cy="17" r="4.5" fill="#f6ad55"/>
      <text x="28" y="21" fill="#ffffff" font-weight="600">RobotSession amr2</text>
      <text x="16" y="38" fill="#a0c4e8" font-size="11">pick · PALLET-42</text>
      <use href="#inbox" x="176" y="24"/>
    </g>
    <g transform="translate(696 222)">
      <rect width="218" height="48" rx="9" fill="#0f1b2d" fill-opacity="0.65" stroke="#4fd1c5" stroke-opacity="0.5"/>
      <circle cx="16" cy="17" r="4.5" fill="#ecc94b"/>
      <text x="28" y="21" fill="#ffffff" font-weight="600">RobotSession amr3</text>
      <text x="16" y="38" fill="#a0c4e8" font-size="11">charging · 64 %</text>
      <use href="#inbox" x="176" y="24"/>
    </g>
  </g>

  <!-- transport to MQTT -->
  <rect x="696" y="284" width="218" height="32" rx="9" fill="#c05621" fill-opacity="0.18" stroke="#f6ad55" stroke-opacity="0.7"/>
  <text x="805" y="305" fill="#f6ad55" font-size="12.5" font-weight="600" text-anchor="middle">RobotMessageRouter · Outbox</text>

  <!-- ============================ MQTT broker ============================ -->
  <path d="M932 185H968" stroke="#f6ad55" stroke-width="2" fill="none" marker-start="url(#arrow-mqtt)" marker-end="url(#arrow-mqtt)"/>
  <text x="950" y="175" fill="#f6ad55" font-size="12" font-weight="600" text-anchor="middle">MQTT</text>

  <g transform="translate(1000 185)">
    <circle r="30" fill="url(#glow)"/>
    <g stroke="#f6ad55" stroke-width="2" stroke-opacity="0.7">
      <path d="M0 0L0 -18M0 0L15.6 -9M0 0L15.6 9M0 0L0 18M0 0L-15.6 9M0 0L-15.6 -9"/>
    </g>
    <g fill="#c05621" stroke="#f6ad55" stroke-width="1.5">
      <circle cy="-18" r="4.5"/>
      <circle cx="15.6" cy="-9" r="4.5"/>
      <circle cx="15.6" cy="9" r="4.5"/>
      <circle cy="18" r="4.5"/>
      <circle cx="-15.6" cy="9" r="4.5"/>
      <circle cx="-15.6" cy="-9" r="4.5"/>
    </g>
    <circle r="8" fill="#f6ad55" stroke="#0f1b2d" stroke-width="2"/>
  </g>
  <text x="1000" y="235" fill="#f6ad55" font-size="14" font-weight="600" text-anchor="middle">MQTT broker</text>

  <!-- ============================ robots ============================ -->
  <g stroke="#f6ad55" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-start="url(#arrow-mqtt)" marker-end="url(#arrow-mqtt)">
    <path d="M1024 168L1088 132"/>
    <path d="M1032 185H1086"/>
    <path d="M1024 202L1088 238"/>
  </g>
  <g transform="translate(1124 126) scale(0.6)">
    <use href="#robot"/>
  </g>
  <g transform="translate(1124 186) scale(0.6)">
    <use href="#robot"/>
    <rect x="-22" y="-13" width="34" height="26" rx="3" fill="#f6ad55"/>
    <path d="M-22 -4H12M-22 4H12" stroke="#c97b26" stroke-width="2.5"/>
  </g>
  <g transform="translate(1124 246) scale(0.6)">
    <use href="#robot"/>
  </g>
  <g font-size="12" font-weight="600" fill="#a0c4e8" text-anchor="middle">
    <text x="1124" y="102">amr1</text>
    <text x="1124" y="162">amr2</text>
    <text x="1124" y="222">amr3</text>
  </g>

  <!-- ============================ title ============================ -->
  <g id="brand">
    <text x="56" y="64" fill="url(#wordmark)" font-size="24" font-weight="700" letter-spacing="4.5">COMPASS</text>
    <rect x="219" y="42" width="3" height="26" rx="1.5" fill="#f97316"/>
    <g fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2.2">
      <text x="232" y="53">FLEET</text>
      <text x="232" y="67">SERVER</text>
    </g>
  </g>
  <text x="56" y="140" fill="#ffffff" font-size="50" font-weight="700">fleet_dispatch</text>
  <text x="58" y="182" fill="#a0c4e8" font-size="21">talks to robots over VDA 5050 v3:</text>
  <text x="58" y="210" fill="#a0c4e8" font-size="21">one session per robot, gRPC to fleet_control</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="58" y="236" width="120" height="28" rx="14" fill="#4fd1c5" fill-opacity="0.15" stroke="#4fd1c5"/>
    <text x="118" y="255" fill="#4fd1c5">VDA 5050 v3</text>
    <rect x="188" y="236" width="72" height="28" rx="14" fill="#f6ad55" fill-opacity="0.15" stroke="#f6ad55"/>
    <text x="224" y="255" fill="#f6ad55">MQTT</text>
    <rect x="270" y="236" width="100" height="28" rx="14" fill="#63b3ed" fill-opacity="0.15" stroke="#63b3ed"/>
    <text x="320" y="255" fill="#63b3ed">asio-grpc</text>
    <rect x="380" y="236" width="76" height="28" rx="14" fill="#a0c4e8" fill-opacity="0.15" stroke="#a0c4e8"/>
    <text x="418" y="255" fill="#a0c4e8">C++23</text>
  </g>
</svg>
