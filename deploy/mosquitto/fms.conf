# MQTT-брокер fms (mosquitto 2.x). Кладётся в /etc/mosquitto/conf.d/fms.conf.
# Роботы и сервисы — обычный MQTT, веб-UI — MQTT over WebSocket (только чтение).
# Пароли — в /etc/mosquitto/passwd (создаются mosquitto_passwd, в git не попадают), права — в acl.

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/fms.acl

# Retained-сообщения (connection, factsheet роботов) переживают перезапуск брокера
persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Роботы, fleet_dispatch, симулятор. В mosquitto 2.x без явного listener брокер слушает только localhost.
# На стенде, где 1883 занят (WSL + netsh portproxy), поставить 1884.
listener 1883 0.0.0.0
protocol mqtt

# Веб-UI: MQTT over WebSocket. Если UI открывается по https — здесь нужен TLS (certfile / keyfile) и wss://.
listener 9001 0.0.0.0
protocol websockets
