# Шлюз fms для веб-UI (контракт UI, раздел 1): UI, API и MQTT — с одного адреса http://<машина>:8080/.
#   /fleet-manager/   → собранный UI (dist), лежит в /opt/fms/www/fleet-manager
#   GET /api/fms/*    → fleet_database: списки и карточки, только чтение (кроме /api/fms/routes — control)
#   остальное /api/*  → fleet_control: любые действия (POST, PATCH, DELETE), /api/health, preflight OPTIONS
#   /mqtt             → WebSocket-listener mosquitto (127.0.0.1:9001), UI читает позу роботов
# Позже здесь же — проверка JWT.

upstream fms_database {
    server 127.0.0.1:8002;
}

upstream fms_control {
    server 127.0.0.1:8003;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";          # keep-alive до сервисов
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Маршруты роботов живут в памяти control (c2) — единственный GET /api/fms/*, который не в базу.
    # Точное совпадение (=) nginx проверяет раньше префиксов; строка запроса (?mapId=) в выборе не участвует
    location = /api/fms/routes {
        proxy_pass http://fms_control;
    }

    location /api/fms/ {
        if ($request_method = GET) {
            proxy_pass http://fms_database;
        }
        proxy_pass http://fms_control;
    }

    location /api/ {
        proxy_pass http://fms_control;
    }

    location = / {
        return 302 /fleet-manager/;
    }

    # UI собран с base /fleet-manager/. Всё, что не файл, — index.html: глубокие ссылки разбирает Vue Router.
    # Без $uri/: страница /robots совпала бы с папкой спрайтов robots/ и получила бы 301.
    # no-cache — браузер каждый раз сверяет index.html и config.js с сервером, новая сборка видна сразу.
    location /fleet-manager/ {
        root /opt/fms/www;
        try_files $uri /fleet-manager/index.html;
        add_header Cache-Control "no-cache";
    }

    # MQTT over WebSocket. proxy_set_header внутри location заменяет все общие, поэтому Host — заново,
    # а Connection "" сверху сломал бы WebSocket.
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;             # keepalive MQTT — 60 с, соединение не должно рваться между пингами
    }
}