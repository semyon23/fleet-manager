# Шлюз fms для веб-UI (контракт UI, раздел 1): у UI один адрес /api, шлюз разводит запросы по сервисам.
#   GET /api/fms/*    → fleet_database: списки и карточки, только чтение
#   остальное /api/*  → fleet_control: любые действия (POST, PATCH, DELETE), /api/health, preflight OPTIONS
# Позже здесь же — проверка JWT и раздача собранного UI.

upstream fms_database {
    server 127.0.0.1:8002;
}

upstream fms_control {
    server 127.0.0.1:8003;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";          # keep-alive до сервисов
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/fms/ {
        if ($request_method = GET) {
            proxy_pass http://fms_database;
        }
        proxy_pass http://fms_control;
    }

    location /api/ {
        proxy_pass http://fms_control;
    }
}
