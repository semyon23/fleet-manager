<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="scan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#63b3ed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#63b3ed" stop-opacity="0"/>
    </radialGradient>
    <marker id="end-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#63b3ed"/>
    </marker>
    <marker id="end-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#48bb78"/>
    </marker>

    <!-- AMR with differential drive, top view, centered at (0, 0), heading +x -->
    <g id="robot">
      <circle r="58" fill="url(#scan)"/>
      <g fill="#334155" stroke="#cbd5e1" stroke-width="1.5">
        <rect x="-11" y="-29" width="22" height="9" rx="3"/>
        <rect x="-11" y="20" width="22" height="9" rx="3"/>
      </g>
      <rect x="-34" y="-22" width="68" height="44" rx="10" fill="#e2e8f0" stroke="#63b3ed" stroke-width="3"/>
      <rect x="-24" y="-8" width="30" height="16" rx="3" fill="#cbd5e1"/>
      <circle cx="20" cy="0" r="7" fill="#2d3748"/>
      <circle cx="20" cy="0" r="3" fill="#63b3ed"/>
    </g>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- ============================ fleet view: missions + map graph ============================ -->
  <rect x="496" y="28" width="676" height="304" rx="14" fill="#2b6cb0" fill-opacity="0.12" stroke="#63b3ed" stroke-width="1.5"/>

  <!-- missions: allocated to robots, one waits for a free robot -->
  <text x="514" y="52" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.8">MISSIONS</text>
  <g font-size="12">
    <g transform="translate(512 64)">
      <rect width="172" height="38" rx="7" fill="#0f1b2d" fill-opacity="0.7" stroke="#63b3ed" stroke-opacity="0.45"/>
      <rect width="5" height="38" rx="2" fill="#63b3ed"/>
      <text x="14" y="16" fill="#ffffff" font-weight="600">m-102 · pick PALLET-42</text>
      <text x="14" y="31" fill="#a0c4e8" font-size="10.5">amr1 · on route</text>
    </g>
    <g transform="translate(512 110)">
      <rect width="172" height="38" rx="7" fill="#0f1b2d" fill-opacity="0.7" stroke="#48bb78" stroke-opacity="0.45"/>
      <rect width="5" height="38" rx="2" fill="#48bb78"/>
      <text x="14" y="16" fill="#ffffff" font-weight="600">m-103 · charge</text>
      <text x="14" y="31" fill="#a0c4e8" font-size="10.5">amr2 · on route</text>
    </g>
    <g transform="translate(512 156)">
      <rect width="172" height="38" rx="7" fill="#0f1b2d" fill-opacity="0.7" stroke="#f6ad55" stroke-opacity="0.45"/>
      <rect width="5" height="38" rx="2" fill="#f6ad55"/>
      <text x="14" y="16" fill="#ffffff" font-weight="600">m-104 · drop</text>
      <text x="14" y="31" fill="#a0c4e8" font-size="10.5">amr3 · waits for a node</text>
    </g>
    <g transform="translate(512 202)">
      <rect width="172" height="38" rx="7" fill="none" stroke="#94a3b8" stroke-opacity="0.6" stroke-dasharray="5 4"/>
      <text x="14" y="16" fill="#cbd5e1" font-weight="600">m-105 · pick</text>
      <text x="14" y="31" fill="#7891b0" font-size="10.5">queued · no free robot</text>
    </g>
  </g>
  <g fill="#7891b0" font-size="11">
    <text x="514" y="292">REST ← web UI</text>
    <text x="514" y="309">gRPC → dispatch · database</text>
  </g>

  <!-- map graph -->
  <text x="730" y="52" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.8">MAP GRAPH · ROUTES · TRAFFIC</text>

  <!-- edges -->
  <g stroke="#a0c4e8" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
    <path d="M730 90H1130M730 180H1130M730 270H1130"/>
    <path d="M730 90V270M930 90V270M1130 90V270M1030 180V270"/>
  </g>

  <!-- route of amr1 (m-102): to the pick station, nodes reserved ahead -->
  <path d="M830 180H1130V98" fill="none" stroke="#63b3ed" stroke-width="4" stroke-linejoin="round" marker-end="url(#end-blue)"/>
  <!-- route of amr2 (m-103): to the charger -->
  <path d="M930 270H740" fill="none" stroke="#48bb78" stroke-width="4" marker-end="url(#end-green)"/>
  <!-- amr3 (m-104) wants node (1030, 180), reserved by amr1: waits -->
  <path d="M1030 258V192" fill="none" stroke="#f6ad55" stroke-width="3" stroke-dasharray="5 5" stroke-opacity="0.8"/>

  <!-- nodes -->
  <g fill="#1e293b" stroke="#a0c4e8" stroke-width="2">
    <circle cx="730" cy="90" r="6"/><circle cx="830" cy="90" r="6"/><circle cx="930" cy="90" r="6"/>
    <circle cx="1030" cy="90" r="6"/><circle cx="1130" cy="90" r="6"/>
    <circle cx="730" cy="180" r="6"/><circle cx="830" cy="180" r="6"/><circle cx="930" cy="180" r="6"/>
    <circle cx="1030" cy="180" r="6"/><circle cx="1130" cy="180" r="6"/>
    <circle cx="730" cy="270" r="6"/><circle cx="830" cy="270" r="6"/><circle cx="930" cy="270" r="6"/>
    <circle cx="1030" cy="270" r="6"/><circle cx="1130" cy="270" r="6"/>
  </g>
  <!-- reservations of amr1 -->
  <g fill="none" stroke="#63b3ed" stroke-width="2" stroke-dasharray="3 3">
    <circle cx="930" cy="180" r="11"/>
    <circle cx="1030" cy="180" r="11"/>
    <circle cx="1130" cy="180" r="11"/>
  </g>

  <!-- stations: pick (shelf with a pallet), charger, drop -->
  <g transform="translate(1130 90)">
    <rect x="-13" y="-33" width="26" height="18" rx="2" fill="#c05621" fill-opacity="0.35" stroke="#f6ad55" stroke-width="1.5"/>
    <rect x="-9" y="-29" width="18" height="10" rx="1.5" fill="#f6ad55"/>
  </g>
  <g transform="translate(730 270)">
    <circle cy="28" r="11" fill="#22543d" stroke="#48bb78" stroke-width="1.5"/>
    <path d="M1 20L-4 29H0L-1 36L4 27H0Z" fill="#48bb78"/>
  </g>
  <g transform="translate(1130 270)">
    <rect x="-11" y="17" width="22" height="18" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- robots -->
  <g transform="translate(830 180) scale(0.42)"><use href="#robot"/></g>
  <g transform="translate(930 270) rotate(180) scale(0.42)"><use href="#robot"/></g>
  <g transform="translate(1030 270) rotate(-90) scale(0.42)"><use href="#robot"/></g>

  <!-- amr3 holds: node ahead is reserved -->
  <g transform="translate(1030 225)">
    <circle r="10" fill="#0f1b2d" stroke="#f6ad55" stroke-width="1.5"/>
    <rect x="-4" y="-5" width="3" height="10" rx="1" fill="#f6ad55"/>
    <rect x="1" y="-5" width="3" height="10" rx="1" fill="#f6ad55"/>
  </g>

  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="830" y="160" fill="#63b3ed">amr1</text>
    <text x="930" y="302" fill="#48bb78">amr2</text>
    <text x="1062" y="290" fill="#f6ad55">amr3</text>
  </g>

  <!-- ============================ title ============================ -->
  <g id="brand">
    <text x="56" y="64" fill="url(#wordmark)" font-size="24" font-weight="700" letter-spacing="4.5">COMPASS</text>
    <rect x="219" y="42" width="3" height="26" rx="1.5" fill="#f97316"/>
    <g fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2.2">
      <text x="232" y="53">FLEET</text>
      <text x="232" y="67">SERVER</text>
    </g>
  </g>
  <text x="56" y="140" fill="#ffffff" font-size="50" font-weight="700">fleet_control</text>
  <text x="58" y="182" fill="#a0c4e8" font-size="21">brain of the fms: runs the fleet,</text>
  <text x="58" y="210" fill="#a0c4e8" font-size="21">assigns missions, plans routes</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="58" y="236" width="90" height="28" rx="14" fill="#63b3ed" fill-opacity="0.15" stroke="#63b3ed"/>
    <text x="103" y="255" fill="#63b3ed">missions</text>
    <rect x="158" y="236" width="80" height="28" rx="14" fill="#48bb78" fill-opacity="0.15" stroke="#48bb78"/>
    <text x="198" y="255" fill="#48bb78">routes</text>
    <rect x="248" y="236" width="76" height="28" rx="14" fill="#f6ad55" fill-opacity="0.15" stroke="#f6ad55"/>
    <text x="286" y="255" fill="#f6ad55">traffic</text>
    <rect x="334" y="236" width="76" height="28" rx="14" fill="#a0c4e8" fill-opacity="0.15" stroke="#a0c4e8"/>
    <text x="372" y="255" fill="#a0c4e8">C++23</text>
  </g>
</svg>
