// Стандартный протокол проверки gRPC (grpc.health.v1). Сервер — в GrpcServer каждого сервиса fms
// (EnableDefaultHealthCheckService); этот файл нужен клиентам: fleet_control и grpcurl -proto.
syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  string service = 1;   // "" — сервис целиком
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}